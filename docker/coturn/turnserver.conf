# TG-Like Messenger — local TURN server configuration.
#
# This configuration intentionally keeps TURN usable for local development and
# for small self-hosted deployments. TLS/WSS is NOT enabled here on purpose:
# for production behind HTTPS you should provide real certificates and
# uncomment the `cert` / `pkey` options at the bottom of this file.

listening-port=3478
fingerprint
lt-cred-mech
user=tglike:tglike_secret_turn_credential
realm=tglike.local
stale-nonce=600

# Relay allocation range. These UDP ports are published by docker-compose.yml
# and MUST match `MIN_PORT`/`MAX_PORT` there.
min-port=49160
max-port=49200

# Log to stdout so `docker compose logs coturn` shows live activity.
log-file=stdout
verbose

# --- Optional TLS (production only) ------------------------------------------
# cert=/etc/coturn/certs/turn.crt
# pkey=/etc/coturn/certs/turn.key

