global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: flux
    metrics_path: /api/v1/metrics
    # The compose entrypoint writes METRICS_TOKEN into this file at start.
    authorization:
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["server:3000"]
