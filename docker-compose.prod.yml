# Production stack for one VPS: Caddy (automatic HTTPS) in front of the API, the web app and storage.
#   cp .env.prod.example .env.prod   # fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Only Caddy (80/443) is published. Group calls / TURN are optional: add `--profile calls`.
name: flux

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    <<: *restart
    image: redis:7-alpine
    # noeviction: BullMQ must never lose queue keys under memory pressure.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  # S3-compatible storage; signed requests only (identity written from the env on every start).
  seaweedfs:
    <<: *restart
    image: chrislusf/seaweedfs:3.73
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"flux","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data -s3.port=9000 -volume.max=0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes: [seaweedfs_data:/data]
    networks: [internal]

  # One-shot: applies migrations and exits. The API starts only after it succeeded.
  migrate:
    build: { context: ., dockerfile: docker/server/Dockerfile, target: builder }
    image: flux-migrate
    command: ["pnpm", "--filter", "@FLUX/server", "exec", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  server:
    <<: *restart
    build: { context: ., dockerfile: docker/server/Dockerfile, target: runner }
    image: flux-server
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://seaweedfs:9000
      S3_PUBLIC_ENDPOINT: https://s3.${DOMAIN}
      S3_FORCE_PATH_STYLE: "true"
      FRONTEND_URL: https://${DOMAIN}
      TRUST_PROXY: "1" # Caddy is the single proxy in front
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      seaweedfs: { condition: service_started }
    networks: [internal]

  web:
    <<: *restart
    build: { context: ., dockerfile: docker/web/Dockerfile }
    image: flux-web
    networks: [internal]

  caddy:
    <<: *restart
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [server, web]
    networks: [internal]

  # Optional (`--profile calls`): need real UDP reachability, hence host networking. Ports: docs/DEPLOY-VPS.md.
  coturn:
    <<: *restart
    profiles: ["calls"]
    image: coturn/coturn:latest
    network_mode: host
    volumes: ["./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro"]
    command: -c /etc/coturn/turnserver.conf

  livekit:
    <<: *restart
    profiles: ["calls"]
    image: livekit/livekit-server:latest
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
    volumes: ["./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro"]

  # --- optional: `--profile monitoring` -----------------------------------------------------------
  # Prometheus + Grafana, reachable only from the VPS itself (ssh -L 3001:127.0.0.1:3001 user@host).
  prometheus:
    <<: *restart
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '%s' "$$METRICS_TOKEN" > /tmp/metrics_token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=30d
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [internal]

  grafana:
    <<: *restart
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3001:3000"]
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [internal]

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  redis_data:
  seaweedfs_data:
  caddy_data:
  caddy_config:

networks:
  internal:
