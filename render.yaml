# Render Blueprint: the FLUX API as one free web service. Postgres lives in Neon, Redis in Upstash,
# files in an S3-compatible bucket (Cloudflare R2 / Backblaze B2). Values marked `sync: false` are asked for
# in the Render dashboard once and never stored in the repository.
services:
  - type: web
    name: flux-api
    runtime: docker
    plan: free
    dockerfilePath: docker/server/Dockerfile
    dockerContext: .
    dockerTarget: render
    healthCheckPath: /api/v1/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: PORT, value: "3000" }
      - { key: TRUST_PROXY, value: "1" }
      - { key: FRONTEND_URL, value: https://fluxmess.netlify.app }
      - { key: DATABASE_URL, sync: false }
      - { key: REDIS_URL, sync: false }
      - { key: JWT_ACCESS_SECRET, generateValue: true }
      - { key: JWT_REFRESH_SECRET, generateValue: true }
      - { key: PASSCODE_PEPPER, generateValue: true }
      - { key: METRICS_TOKEN, generateValue: true }
      - { key: S3_ENDPOINT, sync: false }
      - { key: S3_PUBLIC_ENDPOINT, sync: false }
      - { key: S3_ACCESS_KEY, sync: false }
      - { key: S3_SECRET_KEY, sync: false }
      - { key: S3_REGION, value: auto }
      - { key: S3_FORCE_PATH_STYLE, value: "true" }
